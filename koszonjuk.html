<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Köszönjük a vásárlást! - SOS Eltévedtem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0F172A;
            color: #FFFFFF;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #1E293B;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #10B981; font-size: 24px; margin-bottom: 10px; }
        p { color: #94A3B8; font-size: 14px; line-height: 1.5; }
        .step-box {
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            background-color: #1E293B;
            border: 1px solid #475569;
            color: #FFF;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #10B981;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #059669; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #064E3B;
            border: 1px solid #10B981;
            border-radius: 8px;
            display: none;
        }
        .code-display {
            font-size: 28px;
            font-weight: bold;
            color: #34D399;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        .download-btn {
            background-color: #3B82F6;
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .download-btn:hover { background-color: #2563EB; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎉 Köszönjük a megrendelést!</h1>
        <p>A fizetés sikeresen megtörtént. Az alábbi lépések követésével azonnal aktiválhatod az alkalmazást.</p>

        <!-- Letöltés szekció -->
       <a href="https://github.com/harosi/sos_eltvedtem/releases/latest/download/sos.apk" class="download-btn">
    📥 Alkalmazás letöltése (APK)  </a>
             <!-- Licencgenerátor szekció -->
        <div class="step-box">
            <label for="deviceIdInput" style="font-weight: bold; color: #E2E8F0;">Add meg a telefonos applikációban látható 4 jegyű Készülékkódot:</label>
            <input type="number" id="deviceIdInput" placeholder="pl. 4821" min="1000" max="9999">
            <button onclick="generateCode()">Feloldókód generálása</button>
        </div>

        <!-- Eredmény doboz -->
        <div id="resultBox" class="result-box">
            <p style="margin: 0; color: #E2E8F0;">A te egyedi feloldókódod:</p>
            <div id="activationCodeDisplay" class="code-display">------</div>
            <p style="font-size: 12px; margin-top: 8px; color: #A7F3D0;">Írd be ezt a kódot az applikáció licenc aktiváló mezőjébe!</p>
        </div>
    </div>

    <script>
        // Pontosan ugyanazok a konstansok, mint a Dart oldalon és a Google Scriptben
        const _secretSalt = 0x5F3759DF;
        const _prime1 = 73856093;
        const _prime2 = 19349663;

        function generateCode() {
            const inputVal = document.getElementById('deviceIdInput').value.trim();
            const devId = parseInt(inputVal, 10);

            if (isNaN(devId) || devId < 1000 || devId > 9999) {
                alert("Kérlek, egy érvényes 4 jegyű készülékkódot adj meg!");
                return;
            }

            // JavaScript 32 bites szorzás emuláció (Math.imul)
            let hash = Math.imul((devId ^ _secretSalt), _prime1);
            hash = Math.imul((hash ^ (hash >> 13)), _prime2);
            hash = (hash ^ (hash >> 16)) & 0xFFFFFFFF;

            let finalCode = (Math.abs(hash) % 900000) + 100000;

            // Megjelenítés
            document.getElementById('activationCodeDisplay').innerText = finalCode;
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>

</body>
</html>
